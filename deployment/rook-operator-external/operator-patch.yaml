kind: ConfigMap
apiVersion: v1
metadata:
  name: rook-ceph-operator-config
  namespace: rook-ceph
data:
  CSI_PROVISIONER_NODE_AFFINITY: ""
  CSI_PLUGIN_NODE_AFFINITY: ""
  CSI_PROVISIONER_TOLERATIONS: ""
  CSI_CEPHFS_PROVISIONER_TOLERATIONS: ""
  CSI_CEPHFS_PLUGIN_TOLERATIONS: ""
  DISCOVER_TOLERATIONS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  template:
    spec:
      tolerations: []
      affinity:
        $patch: delete
