# Shoot that runs the Ceph cluster (the "provider", when the cluster is shared with other Shoots).
# Values are the ones used on the OSC dev landscape; adjust project, region, zones and CIDRs.
apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: ceph
  namespace: garden-prod
  annotations:
    dashboard.garden.sapcloud.io/no-hibernation-schedule: 'true'
spec:
  cloudProfile:
    kind: CloudProfile
    name: onmetal
  credentialsBindingName: ds0-0-creds
  region: dev
  purpose: production
  seedSelector:
    matchLabels:
      purpose: prod-ds0-0
  dns:
    domain: ceph.prod.dg0.dev.osc.live
  extensions:
    # Self-service peering of the node networks. Every consumer shoot is listed here,
    # and every consumer shoot lists this shoot in its own peering config.
    # Leave this extension out for a Ceph cluster that is not shared.
    - type: osc-peering-service
      providerConfig:
        apiVersion: service.peering.extensions.osc.t-systems.com/v1
        kind: PeeringConfig
        shootPeerings:
          - name: test
            namespace: garden-dev
            seed: ds0-0
    - type: shoot-dns-service
      providerConfig:
        apiVersion: service.dns.extensions.gardener.cloud/v1alpha1
        kind: DNSConfig
        syncProvidersFromShootSpecDNS: true
  kubernetes:
    # Rook v1.21 requires Kubernetes v1.32 or newer
    version: 1.34.8
    kubeAPIServer:
      defaultNotReadyTolerationSeconds: 300
      defaultUnreachableTolerationSeconds: 300
    kubeControllerManager:
      nodeCIDRMaskSize: 24
      nodeMonitorGracePeriod: 40s
    kubeProxy:
      enabled: false
      mode: IPTables
    kubeScheduler:
      profile: balanced
    kubelet:
      failSwapOn: true
      kubeReserved:
        cpu: 80m
        memory: 1Gi
        pid: 20k
  networking:
    type: cilium
    providerConfig:
      apiVersion: cilium.networking.extensions.gardener.cloud/v1alpha1
      kind: NetworkConfig
      bpfSocketLBHostnsOnly:
        enabled: true
      cni:
        exclusive: false
      overlay:
        enabled: false
      store: kubernetes
      tunnel: disabled
    ipFamilies:
      - IPv4
    # The node network is what peered shoots reach. It must not overlap with the node
    # network of any peered shoot (the landscape default is 10.250.0.0/27).
    nodes: 10.251.0.0/26
    pods: 100.64.0.0/11
    services: 100.32.0.0/13
  maintenance:
    autoUpdate:
      kubernetesVersion: false
      machineImageVersion: false
    timeWindow:
      begin: 000000+0100
      end: 010000+0100
  provider:
    type: onmetal
    workers:
      # One dedicated pool per zone for the Ceph daemons (mon, mgr, osd, mds)
      - &rook-pool
        name: rook-az1
        cri:
          name: containerd
        labels:
          dedicated: rook
          role: osd-node
        taints:
          - key: dedicated
            value: rook
            effect: NoSchedule
        machine:
          type: vm-dedicated-4-16
          architecture: amd64
          image:
            name: gardenlinux
            version: 2150.4.0-7
        minimum: 1
        maximum: 1
        maxSurge: 1
        maxUnavailable: 0
        volume:
          type: fast
          size: 50Gi
        systemComponents:
          allow: false
        machineControllerManager:
          # do not replace a node with Ceph daemons because of a short outage
          machineHealthTimeout: 168h0m0s
          maxEvictRetries: 30
        zones:
          - dev1
      - <<: *rook-pool
        name: rook-az2
        zones:
          - dev2
      - <<: *rook-pool
        name: rook-az3
        zones:
          - dev3
      # General purpose pool for system components and everything else
      - name: pool1
        cri:
          name: containerd
        machine:
          type: vm-dedicated-2-4
          architecture: amd64
          image:
            name: gardenlinux
            version: 2150.4.0-7
        minimum: 3
        maximum: 3
        maxSurge: 1
        maxUnavailable: 0
        volume:
          type: fast
          size: 50Gi
        systemComponents:
          allow: true
        zones:
          - dev1
          - dev2
          - dev3
  systemComponents:
    coreDNS:
      autoscaling:
        mode: horizontal
