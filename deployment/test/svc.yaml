apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/onmetal-load-balancer-internal: "true"
  name: test
  namespace: cephfs-test
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - appProtocol: http
      name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app: nginx
  sessionAffinity: None
  type: LoadBalancer
