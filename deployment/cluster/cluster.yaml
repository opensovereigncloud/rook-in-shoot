apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: registry.osc.live/osc/iaas/ceph:v20.2.4
    allowUnsupported: false
  security:
    # The key of each encrypted OSD volume (see storage below) is a Kubernetes Secret in
    # this namespace. Rook replaces these keys on this schedule.
    keyRotation:
      enabled: true
      schedule: "@weekly"
    cephx:
      csi:
        # AES256K keys can only be used by Linux kernel 7.0 and newer. Keep "aes" until
        # every node that mounts a volume, in this and in all consumer clusters, runs it.
        keyType: aes
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  waitTimeoutForHealthyOSDInMinutes: 10
  mon:
    count: 3
    allowMultiplePerNode: false
    volumeClaimTemplate:
      spec:
        storageClassName: default
        resources:
          requests:
            storage: 10Gi
  mgr:
    count: 2
    allowMultiplePerNode: true
    modules:
      - name: pg_autoscaler
        enabled: false
      - name: nfs
        enabled: false
  dashboard:
    # Off: on the host network the dashboard would answer on the node address of the
    # active mgr, for every peered Shoot.
    enabled: false
    ssl: true
  monitoring:
    # The metrics of Ceph are served either way, by the Services rook-ceph-mgr (9283) and
    # rook-ceph-exporter (9926). Set this to true once a Prometheus operator runs in this
    # Shoot: Rook then creates the ServiceMonitors for it.
    enabled: false
  network:
    connections:
      # Encrypt all traffic between the Ceph daemons and to the clients. A client that
      # does not offer encryption is refused. Consumers set the same in their CephCluster.
      encryption:
        enabled: true
      compression:
        enabled: false
      # msgr2 only (port 3300). Needs Linux kernel 5.11 or newer on every client node.
      requireMsgr2: true
    provider: host
    internalLoadBalancerService:
      enabled: true
      labels:
        service.beta.kubernetes.io/onmetal-load-balancer-internal: "true"
    ipFamily: "IPv4"
    dualStack: false
  crashCollector:
    disable: false
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: dedicated
                  operator: In
                  values:
                    - rook
      tolerations:
      - effect: NoSchedule
        key: dedicated
        value: rook
  annotations:
  labels:
  resources:
    mon:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    mgr:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    osd:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  removeOSDsIfOutAndSafeToRemove: true
  priorityClassNames:
    mgr: system-cluster-critical
    mon: system-node-critical
    osd: system-node-critical
  storage:
    useAllNodes: false
    storageClassDeviceSets:
      - name: osc
        count: 3
        portable: true
        # dm-crypt on the OSD volumes
        encrypted: true
        tuneFastDeviceClass: true
        placement:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - rook-ceph-osd
        preparePlacement:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - rook-ceph-osd-prepare
                topologyKey: topology.kubernetes.io/zone
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - rook-ceph-osd-prepare
                      - rook-ceph-osd
        volumeClaimTemplates:
          - metadata:
              name: ceph-osd-data
            spec:
              resources:
                requests:
                  storage: 50G
              storageClassName: default
              volumeMode: Block
              accessModes:
                - ReadWriteOnce
    onlyApplyOSDPlacement: false
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 0
    manageMachineDisruptionBudgets: false
  healthCheck:
    # Ceph v20 warns about every key that is not AES256K. With "aes" CSI keys these
    # warnings cannot be resolved, so they are muted. Remove this with the keyType above.
    muteHealthWarning:
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    livenessProbe:
      mon:
        disabled: false
      mgr:
        disabled: false
      osd:
        disabled: false
    startupProbe:
      mon:
        disabled: false
      mgr:
        disabled: false
      osd:
        disabled: false
