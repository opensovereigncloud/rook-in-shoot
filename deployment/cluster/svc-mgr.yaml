apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/onmetal-load-balancer-internal: "true"
  name: external-mgr
  namespace: rook-ceph
spec:
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: dashboard
      port: 8443
      protocol: TCP
      targetPort: 8443
    - name: http-metrics
      port: 9283
      protocol: TCP
      targetPort: 9283
  selector:
    app.kubernetes.io/name: ceph-mgr
  sessionAffinity: None
  type: LoadBalancer
